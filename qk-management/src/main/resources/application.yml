spring:
  application:
    name: qk-management

  # 数据库连接信息
  datasource:
    url: jdbc:mysql://localhost:3306/web
    username: root
    password: 88888888
    driver-class-name: com.mysql.cj.jdbc.Driver


  servlet:
    multipart:
      # 文件上传大小限制
      max-file-size: 10MB
      # 请求大小限制
      max-request-size: 10MB


